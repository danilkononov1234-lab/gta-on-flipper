name: Hotline Miami Momentum 012
on:
  workflow_dispatch:
  push:
    paths:
      - 'hotline_miami/**'
      - '.github/workflows/hotline-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Momentum firmware
        run: git clone --recursive --depth 1 --branch mntm-012 https://github.com/Next-Flip/Momentum-Firmware.git firmware
      - name: Build FAP
        run: |
          cp -r hotline_miami firmware/applications_user/
          cd firmware
          ./fbt fap_hotline_miami
      - name: Collect FAP
        run: |
          mkdir -p artifacts
          find firmware -type f -name hotline_miami.fap -print
          fap="$(find firmware -type f -name hotline_miami.fap -print -quit)"
          test -n "$fap"
          cp "$fap" artifacts/hotline_miami.fap
      - uses: actions/upload-artifact@v4
        with:
          name: hotline-miami-momentum-012
          path: artifacts/hotline_miami.fap
          if-no-files-found: error
